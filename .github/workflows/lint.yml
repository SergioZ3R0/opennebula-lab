name: lint

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "."
          severity: warning
          ignore_paths: >-
            node_modules
            .git
          additional_files: ""
        env:
          SHELLCHECK_OPTS: -x -S warning -e SC1090,SC1091

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install yamllint
        run: pipx install yamllint

      - name: Lint YAML (compose + workflows)
        run: |
          yamllint -c .yamllint.yml \
            docker-compose.yml \
            .github/workflows/*.yml

  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "compose config OK"

  conventional-commits:
    name: conventional commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            # first push / force to new branch
            if [ "${BASE}" = "0000000000000000000000000000000000000000" ]; then
              BASE="$(git rev-list --max-parents=0 HEAD)"
            fi
          else
            echo "Manual dispatch: skip range check"
            exit 0
          fi
          if ! git cat-file -e "${BASE}" 2>/dev/null; then
            echo "Base commit missing; checking last commit only"
            BASE="$(git rev-parse "${HEAD}^" 2>/dev/null || echo "${HEAD}")"
          fi
          RANGE="${BASE}..${HEAD}"
          echo "Checking range ${RANGE}"
          FAIL=0
          while IFS= read -r msg; do
            [ -z "${msg}" ] && continue
            echo "commit: ${msg}"
            if echo "${msg}" | grep -q '—'; then
              echo "ERROR: em-dash not allowed in commit messages"
              FAIL=1
            fi
            if ! echo "${msg}" | grep -Eq '^(build|chore|ci|docs|feat|fix|perf|refactor|style|test)(\([^)]+\))?!?: .+'; then
              echo "ERROR: not Conventional Commits format: ${msg}"
              FAIL=1
            fi
          done < <(git log --format=%s "${RANGE}")
          if [ "${FAIL}" -ne 0 ]; then
            echo "Commit message lint failed"
            exit 1
          fi
          echo "Commit messages OK"
